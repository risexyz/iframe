<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Learning Center</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #666;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Learning Center</h1>

      <p>
        Website pembelajaran dengan akses khusus.
      </p>

      <a href="#" class="btn">
        Login
      </a>

    </div>

  </div>

</body>
</html>
