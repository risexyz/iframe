<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Learning Center</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}header{background:#222;color:#fff;padding:18px 20px}.header-inner,main{max-width:1200px;margin:auto}.header-inner{display:flex;align-items:center;justify-content:space-between;gap:15px}.title{font-size:20px;font-weight:700}.admin-name{font-size:13px;opacity:.8;margin-top:4px}.logout{border:1px solid #777;background:transparent;color:#fff;padding:9px 14px;border-radius:7px;cursor:pointer}main{padding:25px 20px 40px}.summary{display:flex;gap:12px;margin-bottom:20px}.summary-box,.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 5px 20px #0000000d}.summary-box{flex:1}.summary-label{font-size:12px;color:#777;margin-bottom:7px}.summary-number{font-size:25px;font-weight:700}.card{margin-bottom:20px}h2{margin:0 0 20px;font-size:19px}.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}.add-button{padding:11px 18px;border:0;border-radius:8px;background:#222;color:#fff;cursor:pointer;font-weight:600}.message{margin-top:14px;padding:10px;border-radius:8px;display:none;font-size:14px}.message.success{display:block;background:#edf8ef;color:#26733a}.message.error{display:block;background:#fff0f0;color:#b42318}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:13px 10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}th{font-size:12px;color:#777;text-transform:uppercase}.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:600}.active{background:#eaf7ed;color:#26733a}.inactive{background:#fff0f0;color:#b42318}.actions{display:flex;gap:7px;flex-wrap:wrap}.action-button{border:0;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer}.toggle-button{background:#eee;color:#333}.reset-button{background:#eef3ff;color:#2457a6}.delete-button{background:#fff0f0;color:#b42318}.action-button:disabled{opacity:.5;cursor:not-allowed}.empty{text-align:center;padding:25px;color:#777}@media(max-width:800px){.form-grid{grid-template-columns:1fr 1fr}.add-button{width:100%}}@media(max-width:520px){header{padding:15px}main{padding:18px 12px 30px}.card{padding:17px}.form-grid{grid-template-columns:1fr}.summary{display:grid;grid-template-columns:1fr 1fr}.summary-box{padding:15px}}
</style>
</head>
<body>
<header><div class="header-inner"><div><div class="title">Learning Center — Admin</div><div class="admin-name" id="adminName">Memeriksa session...</div></div><button class="logout" id="logoutButton">Logout</button></div></header>
<main>
<div class="summary"><div class="summary-box"><div class="summary-label">Total Pengguna</div><div class="summary-number" id="totalUsers">0</div></div><div class="summary-box"><div class="summary-label">Pengguna Aktif</div><div class="summary-number" id="activeUsers">0</div></div><div class="summary-box"><div class="summary-label">Pengguna Nonaktif</div><div class="summary-number" id="inactiveUsers">0</div></div></div>
<section class="card"><h2>Tambah Pengguna</h2><form id="addUserForm"><div class="form-grid"><div><label>Nama</label><input id="name" required placeholder="Nama pengguna"></div><div><label>Username</label><input id="username" required placeholder="Username"></div><div><label>Password</label><input id="password" type="password" required placeholder="Minimal 6 karakter"></div><button class="add-button" id="addButton">+ Tambah</button></div></form><div id="formMessage" class="message"></div></section>
<section class="card"><h2>Daftar Pengguna</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nama</th><th>Username</th><th>Role</th><th>Status</th><th>Dibuat</th><th>Aksi</th></tr></thead><tbody id="usersBody"><tr><td colspan="7" class="empty">Memuat data...</td></tr></tbody></table></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const adminName=$('adminName'),usersBody=$('usersBody'),form=$('addUserForm'),addButton=$('addButton'),msg=$('formMessage');
function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function show(text,type){msg.textContent=text;msg.className='message '+type}
async function checkAdmin(){try{const r=await fetch('/api/me',{credentials:'same-origin'}),d=await r.json();if(!r.ok||!d.success||d.user.role!=='admin'){location.href='/';return false}adminName.textContent='Login sebagai: '+d.user.name;return true}catch(e){location.href='/';return false}}
async function loadUsers(){usersBody.innerHTML='<tr><td colspan="7" class="empty">Memuat data...</td></tr>';try{const r=await fetch('/api/admin/users',{credentials:'same-origin'}),d=await r.json();if(!r.ok||!d.success){usersBody.innerHTML='<tr><td colspan="7" class="empty">'+esc(d.message||'Gagal memuat data.')+'</td></tr>';return}const users=Array.isArray(d.users)?d.users:[],only=users.filter(u=>u.role==='user');$('totalUsers').textContent=only.length;$('activeUsers').textContent=only.filter(u=>Number(u.active)===1).length;$('inactiveUsers').textContent=only.filter(u=>Number(u.active)===0).length;if(!users.length){usersBody.innerHTML='<tr><td colspan="7" class="empty">Belum ada pengguna.</td></tr>';return}usersBody.innerHTML=users.map(u=>{const admin=u.role==='admin',active=Number(u.active)===1;return '<tr><td>'+esc(u.id)+'</td><td>'+esc(u.name)+'</td><td>'+esc(u.username)+'</td><td>'+esc(u.role)+'</td><td><span class="status '+(active?'active':'inactive')+'">'+(active?'Aktif':'Nonaktif')+'</span></td><td>'+esc(u.created_at)+'</td><td>'+(admin?'<b>Akun Admin</b>':'<div class="actions"><button class="action-button toggle-button" onclick="toggleUser('+Number(u.id)+','+(active?0:1)+')">'+(active?'Nonaktifkan':'Aktifkan')+'</button><button class="action-button reset-button" onclick="resetPassword('+Number(u.id)+',\''+esc(u.name)+'\')">Reset Password</button><button class="action-button delete-button" onclick="deleteUser('+Number(u.id)+',\''+esc(u.name)+'\')">Hapus</button></div>')+'</td></tr>'}).join('')}catch(e){usersBody.innerHTML='<tr><td colspan="7" class="empty">Tidak dapat terhubung ke server.</td></tr>'}}
async function toggleUser(id,active){if(!confirm(active?'Yakin ingin mengaktifkan pengguna ini?':'Yakin ingin menonaktifkan pengguna ini?'))return;try{const r=await fetch('/api/admin/user',{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({id,active})}),d=await r.json();if(!r.ok||!d.success){alert(d.message||'Gagal mengubah status.');return}await loadUsers()}catch(e){alert('Tidak dapat terhubung ke server.')}}
async function resetPassword(id,name){const password=prompt('Masukkan password baru untuk '+name+' (minimal 6 karakter):');if(password===null)return;if(password.length<6){alert('Password minimal 6 karakter.');return}const confirmPassword=prompt('Ulangi password baru:');if(confirmPassword===null)return;if(password!==confirmPassword){alert('Password tidak sama.');return}try{const r=await fetch('/api/admin/user',{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({id,password})}),d=await r.json();if(!r.ok||!d.success){alert(d.message||'Gagal reset password.');return}alert('Password berhasil direset. User harus login kembali.');await loadUsers()}catch(e){alert('Tidak dapat terhubung ke server.')}}
async function deleteUser(id,name){if(!confirm('Yakin ingin menghapus pengguna "'+name+'"?\n\nData tidak dapat dikembalikan.'))return;try{const r=await fetch('/api/admin/user',{method:'DELETE',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({id})}),d=await r.json();if(!r.ok||!d.success){alert(d.message||'Gagal menghapus pengguna.');return}await loadUsers()}catch(e){alert('Tidak dapat terhubung ke server.')}}
form.addEventListener('submit',async e=>{e.preventDefault();addButton.disabled=true;addButton.textContent='Menyimpan...';try{const r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({name:$('name').value.trim(),username:$('username').value.trim(),password:$('password').value})}),d=await r.json();if(!r.ok||!d.success)show(d.message||'Gagal membuat pengguna.','error');else{show('Pengguna berhasil dibuat.','success');form.reset();await loadUsers()}}catch(e){show('Tidak dapat terhubung ke server.','error')}finally{addButton.disabled=false;addButton.textContent='+ Tambah'}});
$('logoutButton').onclick=async()=>{try{await fetch('/api/logout',{method:'POST',credentials:'same-origin'})}catch(e){}location.href='/'};
(async()=>{if(await checkAdmin())await loadUsers()})();
</script>
</body>
</html>
