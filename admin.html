<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Learning Center</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}header{background:#222;color:#fff;padding:18px 20px}.header-inner,main{max-width:1200px;margin:auto}.header-inner{display:flex;align-items:center;justify-content:space-between;gap:15px}.title{font-size:20px;font-weight:700}.admin-name{font-size:13px;opacity:.8;margin-top:4px}.logout{border:1px solid #777;background:transparent;color:#fff;padding:9px 14px;border-radius:7px;cursor:pointer}main{padding:25px 20px 40px}.summary{display:flex;gap:12px;margin-bottom:20px}.summary-box,.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 5px 20px #0000000d}.summary-box{flex:1}.summary-label{font-size:12px;color:#777;margin-bottom:7px}.summary-number{font-size:25px;font-weight:700}.card{margin-bottom:20px}h2{margin:0 0 20px;font-size:19px}.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}.add-button{padding:11px 18px;border:0;border-radius:8px;background:#222;color:#fff;cursor:pointer;font-weight:600}.message{margin-top:14px;padding:10px;border-radius:8px;display:none;font-size:14px}.message.success{display:block;background:#edf8ef;color:#26733a}.message.error{display:block;background:#fff0f0;color:#b42318}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:13px 10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}th{font-size:12px;color:#777;text-transform:uppercase}.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:600}.active{background:#eaf7ed;color:#26733a}.inactive{background:#fff0f0;color:#b42318}.actions{display:flex;gap:7px;flex-wrap:wrap}.action-button{border:0;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer}.toggle-button{background:#eee;color:#333}.reset-button{background:#eef3ff;color:#2457a6}.delete-button{background:#fff0f0;color:#b42318}.action-button:disabled{opacity:.5;cursor:not-allowed}.empty{text-align:center;padding:25px;color:#777}@media(max-width:800px){.form-grid{grid-template-columns:1fr 1fr}.add-button{width:100%}}@media(max-width:520px){header{padding:15px}main{padding:18px 12px 30px}.card{padding:17px}.form-grid{grid-template-columns:1fr}.summary{display:grid;grid-template-columns:1fr 1fr}.summary-box{padding:15px}}
</style>
</head>
<body>
<header><div class="header-inner"><div><div class="title">Learning Center — Admin</div><div class="admin-name" id="adminName">Memeriksa session...</div></div><button class="logout" id="logoutButton" type="button">Logout</button></div></header>
<main>
<div class="summary"><div class="summary-box"><div class="summary-label">Total Pengguna</div><div class="summary-number" id="totalUsers">0</div></div><div class="summary-box"><div class="summary-label">Pengguna Aktif</div><div class="summary-number" id="activeUsers">0</div></div><div class="summary-box"><div class="summary-label">Pengguna Nonaktif</div><div class="summary-number" id="inactiveUsers">0</div></div></div>
<section class="card"><h2>Tambah Pengguna</h2><form id="addUserForm"><div class="form-grid"><div><label for="name">Nama</label><input id="name" required maxlength="100" placeholder="Nama pengguna"></div><div><label for="username">Username</label><input id="username" required maxlength="50" autocomplete="username" placeholder="Username"></div><div><label for="password">Password</label><input id="password" type="password" required minlength="6" maxlength="128" autocomplete="new-password" placeholder="Minimal 6 karakter"></div><button class="add-button" id="addButton" type="submit">+ Tambah</button></div></form><div id="formMessage" class="message" role="status"></div></section>
<section class="card"><h2>Daftar Pengguna</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nama</th><th>Username</th><th>Role</th><th>Status</th><th>Dibuat</th><th>Aksi</th></tr></thead><tbody id="usersBody"><tr><td colspan="7" class="empty">Memuat data...</td></tr></tbody></table></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const adminName=$("adminName"),usersBody=$("usersBody"),form=$("addUserForm"),addButton=$("addButton"),msg=$("formMessage");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function show(text,type){msg.textContent=text;msg.className="message "+type;}
async function jsonResponse(response){try{return await response.json()}catch{return {success:false,message:"Respons server tidak valid."}}}
async function checkAdmin(){try{const r=await fetch("/api/me",{credentials:"same-origin",cache:"no-store"}),d=await jsonResponse(r);if(!r.ok||!d.success||d.user.role!=="admin"){location.replace("/");return false}adminName.textContent="Login sebagai: "+(d.user.name||d.user.username);return true}catch{location.replace("/");return false}}
async function loadUsers(){usersBody.innerHTML='<tr><td colspan="7" class="empty">Memuat data...</td></tr>';try{const r=await fetch("/api/admin/users",{credentials:"same-origin",cache:"no-store"}),d=await jsonResponse(r);if(!r.ok||!d.success){usersBody.innerHTML='<tr><td colspan="7" class="empty">'+esc(d.message||"Gagal memuat data.")+'</td></tr>';return}const users=Array.isArray(d.users)?d.users:[],only=users.filter(u=>u.role==="user");$("totalUsers").textContent=only.length;$("activeUsers").textContent=only.filter(u=>Number(u.active)===1).length;$("inactiveUsers").textContent=only.filter(u=>Number(u.active)===0).length;if(!users.length){usersBody.innerHTML='<tr><td colspan="7" class="empty">Belum ada pengguna.</td></tr>';return}usersBody.innerHTML=users.map(u=>{const admin=u.role==="admin",active=Number(u.active)===1;return '<tr><td>'+esc(u.id)+'</td><td>'+esc(u.name)+'</td><td>'+esc(u.username)+'</td><td>'+esc(u.role)+'</td><td><span class="status '+(active?'active':'inactive')+'">'+(active?'Aktif':'Nonaktif')+'</span></td><td>'+esc(u.created_at)+'</td><td>'+(admin?'<b>Akun Admin</b>':'<div class="actions"><button type="button" class="action-button toggle-button" data-action="toggle" data-id="'+Number(u.id)+'" data-active="'+(active?0:1)+'">'+(active?'Nonaktifkan':'Aktifkan')+'</button><button type="button" class="action-button reset-button" data-action="reset" data-id="'+Number(u.id)+'" data-name="'+esc(u.name)+'">Reset Password</button><button type="button" class="action-button delete-button" data-action="delete" data-id="'+Number(u.id)+'" data-name="'+esc(u.name)+'">Hapus</button></div>')+'</td></tr>'}).join("")}catch{usersBody.innerHTML='<tr><td colspan="7" class="empty">Tidak dapat terhubung ke server.</td></tr>'}}
async function toggleUser(id,active){if(!confirm(active?'Yakin ingin mengaktifkan pengguna ini?':'Yakin ingin menonaktifkan pengguna ini?'))return;try{const r=await fetch("/api/admin/user",{method:"PATCH",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({id,active})}),d=await jsonResponse(r);if(!r.ok||!d.success){alert(d.message||"Gagal mengubah status.");return}await loadUsers()}catch{alert("Tidak dapat terhubung ke server.")}}
async function resetPassword(id,name){const password=prompt("Masukkan password baru untuk "+name+" (minimal 6 karakter):");if(password===null)return;if(password.length<6){alert("Password minimal 6 karakter.");return}const confirmPassword=prompt("Ulangi password baru:");if(confirmPassword===null)return;if(password!==confirmPassword){alert("Password tidak sama.");return}try{const r=await fetch("/api/admin/user",{method:"PATCH",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({id,password})}),d=await jsonResponse(r);if(!r.ok||!d.success){alert(d.message||"Gagal reset password.");return}alert("Password berhasil direset. User harus login kembali.");await loadUsers()}catch{alert("Tidak dapat terhubung ke server.")}}
async function deleteUser(id,name){if(!confirm("Yakin ingin menghapus pengguna \""+name+"\"?\n\nData tidak dapat dikembalikan."))return;try{const r=await fetch("/api/admin/user",{method:"DELETE",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({id})}),d=await jsonResponse(r);if(!r.ok||!d.success){alert(d.message||"Gagal menghapus pengguna.");return}await loadUsers()}catch{alert("Tidak dapat terhubung ke server.")}}
usersBody.addEventListener("click",event=>{const button=event.target.closest("button[data-action]");if(!button)return;const id=Number(button.dataset.id);if(!Number.isInteger(id))return;const action=button.dataset.action;if(action==="toggle")toggleUser(id,Number(button.dataset.active));if(action==="reset")resetPassword(id,button.dataset.name||"pengguna");if(action==="delete")deleteUser(id,button.dataset.name||"pengguna")});
form.addEventListener("submit",async e=>{e.preventDefault();addButton.disabled=true;addButton.textContent="Menyimpan...";try{const r=await fetch("/api/admin/users",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({name:$("name").value.trim(),username:$("username").value.trim(),password:$("password").value})}),d=await jsonResponse(r);if(!r.ok||!d.success)show(d.message||"Gagal membuat pengguna.","error");else{show("Pengguna berhasil dibuat.","success");form.reset();await loadUsers()}}catch{show("Tidak dapat terhubung ke server.","error")}finally{addButton.disabled=false;addButton.textContent="+ Tambah"}});
$("logoutButton").onclick=async()=>{try{await fetch("/api/logout",{method:"POST",credentials:"same-origin",cache:"no-store"})}catch{}location.replace("/")};
(async()=>{if(await checkAdmin())await loadUsers()})();
</script>
</body>
</html>
