<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - Learning Center</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
    }

    .admin-name {
      font-size: 13px;
      opacity: .8;
      margin-top: 4px;
    }

    .logout {
      border: 1px solid rgba(255,255,255,.4);
      background: transparent;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .logout:hover {
      background: rgba(255,255,255,.1);
    }

    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px 40px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    h2 {
      margin: 0 0 20px;
      font-size: 19px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #555;
    }

    button {
      font-family: inherit;
    }

    .add-button {
      padding: 11px 18px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .add-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #edf8ef;
      color: #26733a;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 13px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .active {
      background: #eaf7ed;
      color: #26733a;
    }

    .inactive {
      background: #fff0f0;
      color: #b42318;
    }

    .role {
      font-size: 12px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .action-button {
      border: 0;
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-button {
      background: #eee;
      color: #333;
    }

    .delete-button {
      background: #fff0f0;
      color: #b42318;
    }

    .action-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .summary {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .summary-box {
      flex: 1;
      min-width: 150px;
      background: white;
      padding: 17px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .summary-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 7px;
    }

    .summary-number {
      font-size: 25px;
      font-weight: 700;
    }

    @media (max-width: 800px) {

      .form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .add-button {
        width: 100%;
      }
    }

    @media (max-width: 520px) {

      header {
        padding: 15px;
      }

      .header-inner {
        align-items: flex-start;
      }

      .title {
        font-size: 18px;
      }

      main {
        margin-top: 18px;
        padding: 0 12px 30px;
      }

      .card {
        padding: 17px;
        border-radius: 12px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .summary-box {
        min-width: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div>
      <div class="title">
        Learning Center — Admin
      </div>

      <div class="admin-name" id="adminName">
        Memeriksa session...
      </div>
    </div>

    <button
      class="logout"
      id="logoutButton"
    >
      Logout
    </button>

  </div>
</header>


<main>

  <!-- RINGKASAN -->
  <div class="summary">

    <div class="summary-box">
      <div class="summary-label">
        Total Pengguna
      </div>

      <div
        class="summary-number"
        id="totalUsers"
      >
        0
      </div>
    </div>

    <div class="summary-box">
      <div class="summary-label">
        Pengguna Aktif
      </div>

      <div
        class="summary-number"
        id="activeUsers"
      >
        0
      </div>
    </div>

    <div class="summary-box">
      <div class="summary-label">
        Pengguna Nonaktif
      </div>

      <div
        class="summary-number"
        id="inactiveUsers"
      >
        0
      </div>
    </div>

  </div>


  <!-- TAMBAH USER -->
  <section class="card">

    <h2>
      Tambah Pengguna
    </h2>

    <form id="addUserForm">

      <div class="form-grid">

        <div>
          <label for="name">
            Nama
          </label>

          <input
            id="name"
            type="text"
            placeholder="Nama pengguna"
            required
          >
        </div>

        <div>
          <label for="username">
            Username
          </label>

          <input
            id="username"
            type="text"
            placeholder="Username"
            required
          >
        </div>

        <div>
          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Minimal 6 karakter"
            required
          >
        </div>

        <button
          type="submit"
          class="add-button"
          id="addButton"
        >
          + Tambah
        </button>

      </div>

    </form>

    <div
      id="formMessage"
      class="message"
    ></div>

  </section>


  <!-- DAFTAR USER -->
  <section class="card">

    <h2>
      Daftar Pengguna
    </h2>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Nama</th>
            <th>Username</th>
            <th>Role</th>
            <th>Status</th>
            <th>Dibuat</th>
            <th>Aksi</th>
          </tr>

        </thead>

        <tbody id="usersBody">

          <tr>
            <td
              colspan="7"
              class="empty"
            >
              Memuat data...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<script>

  const adminName =
    document.getElementById("adminName");

  const usersBody =
    document.getElementById("usersBody");

  const addUserForm =
    document.getElementById("addUserForm");

  const addButton =
    document.getElementById("addButton");

  const formMessage =
    document.getElementById("formMessage");

  const logoutButton =
    document.getElementById("logoutButton");

  const totalUsers =
    document.getElementById("totalUsers");

  const activeUsers =
    document.getElementById("activeUsers");

  const inactiveUsers =
    document.getElementById("inactiveUsers");


  function showMessage(text, type) {

    formMessage.textContent = text;

    formMessage.className =
      "message " + type;
  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  async function checkAdmin() {

    try {

      const response =
        await fetch("/api/me", {
          credentials: "same-origin"
        });

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success ||
        data.user.role !== "admin"
      ) {

        window.location.href = "/";

        return false;
      }

      adminName.textContent =
        "Login sebagai: " +
        data.user.name;

      return true;

    } catch (error) {

      window.location.href = "/";

      return false;
    }
  }


  async function loadUsers() {

    usersBody.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Memuat data...
        </td>
      </tr>
    `;

    try {

      const response =
        await fetch("/api/admin/users", {
          credentials: "same-origin"
        });

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success
      ) {

        usersBody.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              ${escapeHtml(
                data.message ||
                "Gagal memuat data."
              )}
            </td>
          </tr>
        `;

        return;
      }

      const users =
        Array.isArray(data.users)
          ? data.users
          : [];

      const userOnly =
        users.filter(
          user => user.role === "user"
        );

      totalUsers.textContent =
        userOnly.length;

      activeUsers.textContent =
        userOnly.filter(
          user => Number(user.active) === 1
        ).length;

      inactiveUsers.textContent =
        userOnly.filter(
          user => Number(user.active) === 0
        ).length;


      if (!users.length) {

        usersBody.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              Belum ada pengguna.
            </td>
          </tr>
        `;

        return;
      }


      usersBody.innerHTML =
        users.map(user => {

          const isAdmin =
            user.role === "admin";

          const isActive =
            Number(user.active) === 1;

          const status =
            isActive
              ? `
                <span class="status active">
                  Aktif
                </span>
              `
              : `
                <span class="status inactive">
                  Nonaktif
                </span>
              `;


          let actions = "";

          if (!isAdmin) {

            actions = `
              <div class="actions">

                <button
                  class="action-button toggle-button"
                  onclick="toggleUser(
                    ${Number(user.id)},
                    ${isActive ? 0 : 1}
                  )"
                >
                  ${isActive
                    ? "Nonaktifkan"
                    : "Aktifkan"}
                </button>

                <button
                  class="action-button delete-button"
                  onclick="deleteUser(
                    ${Number(user.id)},
                    '${escapeHtml(user.name)}'
                  )"
                >
                  Hapus
                </button>

              </div>
            `;

          } else {

            actions = `
              <span class="role">
                Akun Admin
              </span>
            `;
          }


          return `
            <tr>

              <td>
                ${escapeHtml(user.id)}
              </td>

              <td>
                ${escapeHtml(user.name)}
              </td>

              <td>
                ${escapeHtml(user.username)}
              </td>

              <td>
                <span class="role">
                  ${escapeHtml(user.role)}
                </span>
              </td>

              <td>
                ${status}
              </td>

              <td>
                ${escapeHtml(user.created_at)}
              </td>

              <td>
                ${actions}
              </td>

            </tr>
          `;

        }).join("");


    } catch (error) {

      usersBody.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            Tidak dapat terhubung ke server.
          </td>
        </tr>
      `;
    }
  }


  async function toggleUser(id, active) {

    const action =
      active === 1
        ? "mengaktifkan"
        : "menonaktifkan";

    const confirmed =
      confirm(
        `Yakin ingin ${action} pengguna ini?`
      );

    if (!confirmed) {
      return;
    }

    try {

      const response =
        await fetch("/api/admin/user", {

          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          credentials: "same-origin",

          body: JSON.stringify({
            id,
            active
          })

        });

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success
      ) {

        alert(
          data.message ||
          "Gagal mengubah status."
        );

        return;
      }

      await loadUsers();

    } catch (error) {

      alert(
        "Tidak dapat terhubung ke server."
      );
    }
  }


  async function deleteUser(id, name) {

    const confirmed =
      confirm(
        `Yakin ingin menghapus pengguna "${name}"?\n\nData pengguna akan dihapus dan tidak dapat dikembalikan.`
      );

    if (!confirmed) {
      return;
    }

    try {

      const response =
        await fetch("/api/admin/user", {

          method: "DELETE",

          headers: {
            "Content-Type":
              "application/json"
          },

          credentials: "same-origin",

          body: JSON.stringify({
            id
          })

        });

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success
      ) {

        alert(
          data.message ||
          "Gagal menghapus pengguna."
        );

        return;
      }

      await loadUsers();

    } catch (error) {

      alert(
        "Tidak dapat terhubung ke server."
      );
    }
  }


  addUserForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const name =
        document.getElementById("name")
          .value.trim();

      const username =
        document.getElementById("username")
          .value.trim();

      const password =
        document.getElementById("password")
          .value;


      addButton.disabled = true;
      addButton.textContent =
        "Menyimpan...";

      formMessage.className =
        "message";

      formMessage.textContent = "";


      try {

        const response =
          await fetch(
            "/api/admin/users",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              credentials:
                "same-origin",

              body: JSON.stringify({
                name,
                username,
                password
              })

            }
          );

        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          showMessage(
            data.message ||
            "Gagal membuat pengguna.",
            "error"
          );

        } else {

          showMessage(
            "Pengguna berhasil dibuat.",
            "success"
          );

          addUserForm.reset();

          await loadUsers();
        }


      } catch (error) {

        showMessage(
          "Tidak dapat terhubung ke server.",
          "error"
        );

      } finally {

        addButton.disabled = false;
        addButton.textContent =
          "+ Tambah";
      }
    }
  );


  logoutButton.addEventListener(
    "click",
    async function() {

      logoutButton.disabled = true;
      logoutButton.textContent =
        "Logout...";

      try {

        await fetch("/api/logout", {
          method: "POST",
          credentials: "same-origin"
        });

      } catch (error) {
        // Tetap kembali ke login
      }

      window.location.href = "/";
    }
  );


  async function init() {

    const isAdmin =
      await checkAdmin();

    if (!isAdmin) {
      return;
    }

    await loadUsers();
  }


  init();

</script>

</body>
</html>
