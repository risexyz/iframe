<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Learning Center</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
    body{padding:16px}
    .app{max-width:1100px;margin:0 auto}
    .header{background:#222;color:#fff;border-radius:14px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .title{font-size:20px;font-weight:700}.user{font-size:13px;opacity:.8;margin-top:4px}
    .logout{border:1px solid #666;background:transparent;color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}
    .card{margin-top:16px;background:#fff;border-radius:14px;padding:16px;box-shadow:0 5px 20px #0000000d}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .toolbar h2{font-size:17px;margin:0}.actions{display:flex;gap:8px}.run,.stop{border:0;color:#fff;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}.run{background:#222}.stop{background:#8b4513}.run:disabled,.stop:disabled{opacity:.45;cursor:not-allowed}
    .frame-wrap{width:100%;aspect-ratio:16/10;background:#eee;border-radius:10px;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading{position:fixed;inset:0;background:#f4f6f8;display:flex;align-items:center;justify-content:center;font-weight:600;z-index:10}
    .hint{font-size:12px;color:#777;margin:10px 2px 0}
    @media(max-width:600px){body{padding:10px}.header{padding:14px}.title{font-size:18px}.toolbar{align-items:stretch;flex-direction:column}.actions{width:100%}.run,.stop{width:50%}.card{padding:12px}.frame-wrap{aspect-ratio:4/3}}
  </style>
</head>
<body>
  <div id="loading" class="loading">Memeriksa session...</div>
  <main class="app">
    <header class="header">
      <div><div class="title">Learning Center</div><div class="user">Login sebagai: <span id="userName">-</span></div></div>
      <button id="logoutButton" class="logout" type="button">Logout</button>
    </header>

    <section class="card">
      <div class="toolbar">
        <h2>Learning</h2>
        <div class="actions">
          <button id="runButton" class="run" type="button">▶ JALANKAN</button>
          <button id="stopButton" class="stop" type="button" disabled>■ STOP</button>
        </div>
      </div>
      <div class="frame-wrap">
        <iframe id="learningFrame" title="Learning content" src="https://dolarrise.pages.dev/" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <div id="hint" class="hint">Tekan JALANKAN untuk mulai. Setiap offer dibuka di tab baru selama 15 detik, lalu kembali ke halaman utama dan mengulang.</div>
    </section>
  </main>

<script>
  const loading = document.getElementById("loading");
  const userName = document.getElementById("userName");
  const logoutButton = document.getElementById("logoutButton");
  const runButton = document.getElementById("runButton");
  const stopButton = document.getElementById("stopButton");
  const learningFrame = document.getElementById("learningFrame");
  const hint = document.getElementById("hint");

  const DOLLARRISE_URL = "https://dolarrise.pages.dev/";
  const DOLLARRISE_ORIGIN = "https://dolarrise.pages.dev";

  let autoRunning = false;
  let offerTimer = null;
  let childTab = null;
  let cycle = 0;
  let waitingForOffer = false;

  async function checkAccess(){
    try{
      const response = await fetch("/api/me", {credentials:"same-origin",cache:"no-store"});
      const data = await response.json();
      if(!response.ok || !data.success){ location.replace("/"); return; }
      if(data.user.role !== "user"){ location.replace("/admin.html"); return; }
      userName.textContent = data.user.name || data.user.username;
      loading.style.display = "none";
    }catch(error){ location.replace("/"); }
  }

  function clearTimers(){
    if(offerTimer){clearTimeout(offerTimer);offerTimer=null;}
  }

  function updateButtons(){
    runButton.disabled=autoRunning;
    stopButton.disabled=!autoRunning;
  }

  function closeOfferTab(){
    if(childTab && !childTab.closed){
      try{childTab.close();}catch{}
    }
    childTab=null;
  }

  function stopLearning(message="Pembelajaran dihentikan."){
    if(!autoRunning)return;
    clearTimers();
    autoRunning=false;
    waitingForOffer=false;
    cycle++;
    try{learningFrame.contentWindow?.postMessage({type:"STOP_AUTORUN"},DOLLARRISE_ORIGIN);}catch{}
    closeOfferTab();
    learningFrame.src=DOLLARRISE_URL;
    runButton.textContent="▶ JALANKAN";
    hint.textContent=message;
    updateButtons();
  }

  function finishAll(){
    clearTimers();
    autoRunning=false;
    waitingForOffer=false;
    closeOfferTab();
    learningFrame.src=DOLLARRISE_URL;
    runButton.textContent="▶ SELESAI";
    hint.textContent="Semua offer selesai diproses.";
    updateButtons();
  }

  function sendRunUnlock(){
    if(!autoRunning || waitingForOffer || !learningFrame.contentWindow)return;
    learningFrame.contentWindow.postMessage({type:"RUN_UNLOCK"},DOLLARRISE_ORIGIN);
  }

  function startLearning(){
    if(autoRunning)return;

    autoRunning=true;
    waitingForOffer=false;
    cycle++;
    runButton.textContent="▶ MENJALANKAN...";
    hint.textContent="Mencari offer...";
    updateButtons();

    // Dibuka langsung dari klik JALANKAN agar browser mengizinkan satu tab.
    // Tab ini dipakai ulang untuk setiap offer selama proses berjalan.
    childTab=window.open("about:blank","learningOffer");

    if(!childTab){
      autoRunning=false;
      runButton.textContent="▶ JALANKAN";
      hint.textContent="Tab baru diblokir browser. Izinkan pop-up lalu tekan JALANKAN lagi.";
      updateButtons();
      return;
    }

    sendRunUnlock();
  }

  runButton.addEventListener("click",startLearning);
  stopButton.addEventListener("click",()=>stopLearning());

  window.addEventListener("message",event=>{
    if(event.origin!==DOLLARRISE_ORIGIN || !event.data || typeof event.data!=="object")return;
    if(!autoRunning)return;

    if(event.data.type==="OPEN_OFFER"){
      const offerUrl=event.data.url;
      if(typeof offerUrl!=="string" || offerUrl.length>2048)return;

      let parsedUrl;
      try{parsedUrl=new URL(offerUrl);}catch{return;}
      if(parsedUrl.protocol!=="https:" && parsedUrl.protocol!=="http:")return;

      const myCycle=cycle;
      waitingForOffer=true;
      clearTimers();

      // Offer dibuka di tab baru yang sudah diizinkan saat klik JALANKAN.
      if(!childTab || childTab.closed){
        childTab=window.open("about:blank","learningOffer");
      }
      if(!childTab){
        stopLearning("Offer tidak dapat dibuka karena pop-up diblokir.");
        return;
      }

      try{childTab.location.href=parsedUrl.href;childTab.focus();}catch{}
      hint.textContent="Offer sedang dibuka. Menunggu 15 detik...";

      offerTimer=setTimeout(()=>{
        offerTimer=null;
        if(!autoRunning || myCycle!==cycle)return;

        waitingForOffer=false;
        // Tutup tab offer lalu kembali ke halaman utama Dollar Rise.
        closeOfferTab();
        learningFrame.src=DOLLARRISE_URL;

        // Beri waktu halaman utama dimuat sebelum klik offer berikutnya.
        setTimeout(()=>{
          if(!autoRunning || myCycle!==cycle)return;
          hint.textContent="Kembali ke halaman utama. Menjalankan offer berikutnya...";
          sendRunUnlock();
        },1000);
      },15000);
      return;
    }

    if(event.data.type==="OFFER_LIMIT_REACHED"){
      if(waitingForOffer)return;
      clearTimers();
      hint.textContent="Unlock terkena limit. Memilih NEXT OFFER...";

      // Kembali ke halaman utama jika diperlukan, lalu minta Dollar Rise memilih offer berikutnya.
      if(learningFrame.src.startsWith(DOLLARRISE_URL)){
        learningFrame.contentWindow?.postMessage({type:"NEXT_OFFER"},DOLLARRISE_ORIGIN);
      }else{
        learningFrame.src=DOLLARRISE_URL;
        setTimeout(()=>{
          if(autoRunning)learningFrame.contentWindow?.postMessage({type:"NEXT_OFFER"},DOLLARRISE_ORIGIN);
        },1000);
      }
      return;
    }

    if(event.data.type==="OFFER_READY"){
      if(waitingForOffer)return;
      hint.textContent="Offer berikutnya siap. Menjalankan offer...";
      setTimeout(()=>{
        if(autoRunning)sendRunUnlock();
      },500);
      return;
    }

    if(event.data.type==="ALL_OFFERS_DONE"){
      finishAll();
    }
  });

  logoutButton.addEventListener("click",async()=>{
    autoRunning=false;
    cycle++;
    clearTimers();
    closeOfferTab();
    logoutButton.disabled=true;
    logoutButton.textContent="Logout...";
    try{await fetch("/api/logout",{method:"POST",credentials:"same-origin",cache:"no-store"});}catch{}
    location.replace("/");
  });

  updateButtons();
  checkAccess();
</script>
</body>
</html>
