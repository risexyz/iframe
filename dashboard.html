<script>
  const loading = document.getElementById("loading");
  const userName = document.getElementById("userName");
  const logoutButton = document.getElementById("logoutButton");
  const runButton = document.getElementById("runButton");
  const learningFrame = document.getElementById("learningFrame");

  const DOLLARRISE_URL = "https://dolarrise.pages.dev/";
  const DOLLARRISE_ORIGIN = "https://dolarrise.pages.dev";
  const WRAPPER_ORIGIN = "https://iframe-c8r.pages.dev";

  let offerTimer = null;
  let autoRunning = false;
  let waitingForDollarRise = false;
  let runDelayTimer = null;


  // ==========================================
  // CEK LOGIN DAN AKSES USER
  // ==========================================

  async function checkAccess(){
    try{
      const response = await fetch("/api/me", {
        credentials:"same-origin"
      });

      const data = await response.json();

      if(!response.ok || !data.success){
        window.location.href="/";
        return;
      }

      if(data.user.role !== "user"){
        window.location.href="/admin.html";
        return;
      }

      userName.textContent = data.user.name;
      loading.style.display = "none";

    }catch(error){
      window.location.href="/";
    }
  }


  // ==========================================
  // KEMBALIKAN IFRAME KE DOLLARRISE
  // ==========================================

  function returnToDollarRise(callback){

    if(offerTimer){
      clearTimeout(offerTimer);
      offerTimer = null;
    }

    waitingForDollarRise = true;

    learningFrame.src = DOLLARRISE_URL;

    /*
     * Beri waktu DollarRise untuk loading kembali
     * sebelum RUN_UNLOCK dikirim.
     */
    if(runDelayTimer){
      clearTimeout(runDelayTimer);
      runDelayTimer = null;
    }

    runDelayTimer = setTimeout(function(){

      waitingForDollarRise = false;

      if(typeof callback === "function"){
        callback();
      }

    },1000);
  }


  // ==========================================
  // KIRIM RUN_UNLOCK KE DOLLARRISE
  // ==========================================

  function sendRunUnlock(){

    if(!autoRunning){
      return;
    }

    if(!learningFrame.contentWindow){
      return;
    }

    /*
     * Pastikan iframe sedang kembali ke DollarRise.
     */
    if(waitingForDollarRise){
      return;
    }

    learningFrame.contentWindow.postMessage(
      {
        type:"RUN_UNLOCK"
      },
      DOLLARRISE_ORIGIN
    );
  }


  // ==========================================
  // TOMBOL JALANKAN
  // ==========================================

  runButton.addEventListener("click", function(){

    /*
     * Jika sedang berjalan, jangan buat
     * automation kedua.
     */
    if(autoRunning){
      return;
    }

    if(!learningFrame.contentWindow){
      return;
    }

    autoRunning = true;

    runButton.disabled = true;
    runButton.textContent = "▶ MENJALANKAN...";

    sendRunUnlock();

  });


  // ==========================================
  // TERIMA PESAN DARI DOLLARRISE
  // ==========================================

  window.addEventListener("message", function(event){

    /*
     * Hanya menerima pesan dari DollarRise.
     */
    if(event.origin !== DOLLARRISE_ORIGIN){
      return;
    }

    if(!event.data){
      return;
    }


    // ========================================
    // OPEN OFFER
    // ========================================

    if(event.data.type === "OPEN_OFFER"){

      const offerUrl = event.data.url;

      if(!offerUrl || typeof offerUrl !== "string"){
        return;
      }

      let parsedUrl;

      try{
        parsedUrl = new URL(offerUrl);
      }catch(error){
        console.error(
          "URL offer tidak valid:",
          offerUrl
        );
        return;
      }


      /*
       * Hanya izinkan HTTP / HTTPS.
       */
      if(
        parsedUrl.protocol !== "https:" &&
        parsedUrl.protocol !== "http:"
      ){
        return;
      }


      /*
       * Hapus timer sebelumnya.
       */
      if(offerTimer){
        clearTimeout(offerTimer);
        offerTimer = null;
      }

      if(runDelayTimer){
        clearTimeout(runDelayTimer);
        runDelayTimer = null;
      }


      /*
       * Tampilkan offer.
       */
      learningFrame.src = parsedUrl.href;


      /*
       * Offer ditampilkan selama 15 detik.
       */
      offerTimer = setTimeout(function(){

        offerTimer = null;

        /*
         * Kembali ke DollarRise.
         */
        returnToDollarRise(function(){

          /*
           * Jika automation masih aktif,
           * jalankan UNLOCK berikutnya.
           */
          if(autoRunning){
            sendRunUnlock();
          }

        });

      },15000);

    }


    // ========================================
    // OFFER MENCAPAI LIMIT
    // ========================================

    if(event.data.type === "OFFER_LIMIT_REACHED"){

      console.log(
        "Offer mencapai limit:",
        event.data.offerId
      );

      if(!autoRunning){
        return;
      }

      /*
       * Pastikan kembali ke DollarRise
       * sebelum meminta NEXT OFFER.
       */
      if(
        learningFrame.src.startsWith(DOLLARRISE_URL)
      ){

        learningFrame.contentWindow.postMessage(
          {
            type:"NEXT_OFFER"
          },
          DOLLARRISE_ORIGIN
        );

      }else{

        returnToDollarRise(function(){

          if(autoRunning){

            learningFrame.contentWindow.postMessage(
              {
                type:"NEXT_OFFER"
              },
              DOLLARRISE_ORIGIN
            );

          }

        });

      }

    }


    // ========================================
    // OFFER BARU SUDAH SIAP
    // ========================================

    if(event.data.type === "OFFER_READY"){

      console.log("Offer berikutnya siap.");

      if(!autoRunning){
        return;
      }

      /*
       * Jalankan UNLOCK pada offer baru.
       */
      setTimeout(function(){

        if(autoRunning){
          sendRunUnlock();
        }

      },500);

    }


    // ========================================
    // SEMUA OFFER SUDAH HABIS
    // ========================================

    if(event.data.type === "ALL_OFFERS_DONE"){

      console.log("Semua offer sudah selesai.");

      autoRunning = false;

      waitingForDollarRise = false;

      if(offerTimer){
        clearTimeout(offerTimer);
        offerTimer = null;
      }

      if(runDelayTimer){
        clearTimeout(runDelayTimer);
        runDelayTimer = null;
      }

      /*
       * Kembalikan iframe ke DollarRise.
       */
      learningFrame.src = DOLLARRISE_URL;

      /*
       * Ubah tombol menjadi SELESAI.
       */
      runButton.disabled = false;
      runButton.textContent = "▶ SELESAI";

    }

  });


  // ==========================================
  // LOGOUT
  // ==========================================

  logoutButton.addEventListener("click", async function(){

    /*
     * Hentikan automation sebelum logout.
     */
    autoRunning = false;

    if(offerTimer){
      clearTimeout(offerTimer);
      offerTimer = null;
    }

    if(runDelayTimer){
      clearTimeout(runDelayTimer);
      runDelayTimer = null;
    }

    logoutButton.disabled = true;
    logoutButton.textContent = "Logout...";

    try{
      await fetch("/api/logout", {
        method:"POST",
        credentials:"same-origin"
      });
    }catch(error){}

    window.location.href="/";

  });


  // ==========================================
  // MULAI
  // ==========================================

  checkAccess();

</script>
