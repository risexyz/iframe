<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Auto DR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f5f5f5}body{display:flex;flex-direction:column;min-height:100vh}.topbar{padding:14px 18px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}.user{font-weight:700}.actions{display:flex;gap:8px}.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700}.run{background:#111;color:#fff}.stop{background:#8b4513;color:#fff;display:none}.logout{background:#eee;color:#222}.wrap{flex:1;padding:12px;display:flex;flex-direction:column}.framebox{flex:1;width:100%;max-width:1200px;margin:auto;aspect-ratio:16/10;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}iframe{width:100%;height:100%;border:0;display:block}@media(max-width:600px){.wrap{padding:8px}.framebox{aspect-ratio:4/3;border-radius:8px}.topbar{padding:10px 12px}.btn{padding:9px 12px;font-size:12px}}
</style>
</head>
<body>
<div class="topbar"><div class="user" id="userName">Auto DR</div><div class="actions"><button class="btn run" id="runBtn">▶ JALANKAN</button><button class="btn stop" id="stopBtn">■ STOP</button><button class="btn logout" id="logoutBtn">Logout</button></div></div>
<div class="wrap"><div class="framebox"><iframe id="learningFrame" title="Learning content" src="https://dolarrise.pages.dev/" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>
<script>
const DOLLARRISE_URL="https://dolarrise.pages.dev/",DOLLARRISE_ORIGIN="https://dolarrise.pages.dev";
let autoRunning=false,offerTimer=null,countdownTimer=null,mainLoadTimer=null,cycle=0,waitingForOffer=false,iframeLoaded=false,waitingForIframe=false,waitingForNextOffer=false;
let wakeLock=null;
async function requestWakeLock(){if(!('wakeLock' in navigator))return;try{if(wakeLock)return;wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null});}catch(e){console.warn('Wake Lock gagal:',e)}}
async function releaseWakeLock(){if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&autoRunning)requestWakeLock()});
async function checkAccess(){try{const r=await fetch('/api/me',{credentials:'include'});if(!r.ok)throw 0;const d=await r.json();if(!d.authenticated){location.href='/';return}if(d.role&&d.role!=='user'){location.href='/admin.html';return}document.getElementById('userName').textContent=d.name||'User'}catch(e){location.href='/'}}
function clearTimers(){clearTimeout(offerTimer);clearInterval(countdownTimer);clearTimeout(mainLoadTimer);offerTimer=countdownTimer=mainLoadTimer=null}
function sendRunUnlock(){try{document.getElementById('learningFrame').contentWindow.postMessage({type:'RUN_UNLOCK'},DOLLARRISE_ORIGIN)}catch(e){}}
function sendNextOffer(){try{document.getElementById('learningFrame').contentWindow.postMessage({type:'NEXT_OFFER'},DOLLARRISE_ORIGIN)}catch(e){}}
function waitForMainLoad(mode='run'){clearTimeout(mainLoadTimer);iframeLoaded=false;waitingForIframe=true;const f=document.getElementById('learningFrame');const done=()=>{if(!waitingForIframe)return;waitingForIframe=false;iframeLoaded=true;clearTimeout(mainLoadTimer);if(autoRunning){if(mode==='next')sendNextOffer();else sendRunUnlock()}};f.onload=done;f.src=DOLLARRISE_URL;mainLoadTimer=setTimeout(done,5000)}
function startLearning(){if(autoRunning)return;autoRunning=true;cycle=0;waitingForOffer=false;waitingForNextOffer=false;document.getElementById('runBtn').style.display='none';document.getElementById('stopBtn').style.display='inline-block';requestWakeLock();if(iframeLoaded)sendRunUnlock();else waitForMainLoad('run')}
function stopLearning(){autoRunning=false;waitingForOffer=false;waitingForNextOffer=false;clearTimers();releaseWakeLock();document.getElementById('runBtn').style.display='inline-block';document.getElementById('stopBtn').style.display='none';try{document.getElementById('learningFrame').contentWindow.postMessage({type:'STOP_AUTORUN'},DOLLARRISE_ORIGIN)}catch(e){}document.getElementById('learningFrame').src=DOLLARRISE_URL;iframeLoaded=false}
window.addEventListener('message',e=>{if(e.origin!==DOLLARRISE_ORIGIN||!e.data||typeof e.data!=='object'||!autoRunning)return;const d=e.data;if(d.type==='OPEN_OFFER'){if(typeof d.url!=='string'||d.url.length>2048)return;let u;try{u=new URL(d.url)}catch{return}if(!['http:','https:'].includes(u.protocol))return;waitingForOffer=true;waitingForNextOffer=false;clearTimers();iframeLoaded=false;const f=document.getElementById('learningFrame');f.src=u.href;let left=15;countdownTimer=setInterval(()=>{left--;if(left<=0)clearInterval(countdownTimer)},1000);offerTimer=setTimeout(()=>{clearTimers();waitingForOffer=false;if(autoRunning)waitForMainLoad('run')},15000)}else if(d.type==='OFFER_LIMIT_REACHED'){clearTimers();waitingForOffer=false;waitingForNextOffer=true;if(autoRunning)waitForMainLoad('next')}else if(d.type==='OFFER_READY'){if(autoRunning&&!waitingForOffer&&!waitingForNextOffer)sendRunUnlock()}else if(d.type==='ALL_OFFERS_DONE'){clearTimers();waitingForOffer=false;waitingForNextOffer=false;if(autoRunning)waitForMainLoad('run')}});
document.getElementById('runBtn').addEventListener('click',startLearning);document.getElementById('stopBtn').addEventListener('click',stopLearning);document.getElementById('logoutBtn').addEventListener('click',async()=>{stopLearning();try{await fetch('/api/logout',{method:'POST',credentials:'include'})}finally{location.href='/'}});window.addEventListener('beforeunload',releaseWakeLock);checkAccess();
</script>
</body>
</html>
