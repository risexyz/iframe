<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Admin</title>
</head>
<body>

<h2>Buat Admin Pertama</h2>

<form id="form">
  <input id="name" placeholder="Nama admin" required><br><br>
  <input id="username" placeholder="Username admin" required><br><br>
  <input id="password" type="password" placeholder="Password minimal 8 karakter" required><br><br>

  <button type="submit">Buat Admin</button>
</form>

<pre id="result"></pre>

<script>
const form = document.getElementById("form");
const result = document.getElementById("result");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  result.textContent = "Memproses...";

  try {
    const response = await fetch("/api/setup-admin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: document.getElementById("name").value,
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();

    result.textContent = JSON.stringify(data, null, 2);

  } catch (error) {
    result.textContent = "Error: " + error.message;
  }
});
</script>

</body>
</html>
